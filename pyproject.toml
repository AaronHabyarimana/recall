[project]
name = "recall"
version = "0.1.0"
description = "Lernkarten aus Vorlesungsfolien: Ingestion, Generierung, Critic, Review"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "fsrs>=6.3.1",
]

[project.scripts]
recall = "recall.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.0",
]
# Die Oberfläche ist optional: wer nur die Pipeline laufen lässt, braucht kein Streamlit.
ui = [
    "streamlit>=1.49",
]

[tool.uv]
# ...lokal wird sie trotzdem mitinstalliert, sonst scheitert `recall ui` nach dem Klonen.
default-groups = ["dev", "ui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
