[project]
name = "recall"
version = "0.1.0"
description = "Lernkarten aus Vorlesungsfolien: Ingestion, Generierung, Critic, Review"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "fsrs>=6.3.1",
]

[project.scripts]
recall = "recall.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    # Der TestClient von Starlette setzt darauf auf.
    "httpx2>=2.12",
]
# Die Oberfläche ist optional: wer nur die Pipeline laufen lässt, braucht kein Streamlit.
# altair und pandas kommen zwar mit Streamlit mit, werden aber direkt importiert
# (ui/theme.py, ui/app.py) und gehören deshalb hierhin.
ui = [
    "streamlit>=1.49",
    "altair>=5.4",
    "pandas>=2.2",
]
# Ebenfalls optional: die HTTP-Schnittstelle auf dieselbe Lerndatenbank.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
# ...lokal werden sie trotzdem mitinstalliert, sonst scheitern `recall ui` und
# `recall api` nach dem Klonen.
default-groups = ["dev", "ui", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# Weder Streamlit noch die Chart-Bibliotheken liefern brauchbare Stubs mit.
[[tool.mypy.overrides]]
module = ["streamlit.*", "altair.*", "pandas.*", "fitz.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["recall"]
# Die Modul-Einstiegspunkte sind eine Zeile Weiterleitung und verzerren die Quote.
omit = ["*/__main__.py"]
