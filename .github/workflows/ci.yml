name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --all-groups

      - name: Linter
        run: uv run ruff check .

      # Kein API-Key nötig: die Tests prüfen Prompt-Bau und Antwort-Parsing gegen
      # feste Beispielantworten, es geht nichts ins Netz.
      - name: Tests
        run: uv run pytest
