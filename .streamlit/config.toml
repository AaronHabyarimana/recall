# Feste helle Darstellung: die Diagrammfarben sind gegen genau diese Fläche
# (#fcfcfb) auf Kontrast und Farbfehlsichtigkeit geprüft.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
# ohne den "Deploy"-Knopf: die App läuft lokal gegen eine lokale Datenbank
toolbarMode = "minimal"
